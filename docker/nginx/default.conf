# Indexing policy (X-Robots-Tag): only the home page and the CMS content
# pages at /pages/* are indexable; everything else (blog, calendar, people,
# events, connectors, app pages…) returns noindex so search engines drop it.
# noindex is the SEO-correct de-index tool — robots.txt only asks a crawler
# not to fetch, and a fetched-but-noindex page is actively removed from
# results. The AI/SEO crawler fleet that ignores both is blocked outright
# (robots.txt blanket + Cloud Armor). Empty value => nginx omits the header.
map $uri $robots_tag {
    default          "noindex";
    "~^/$"           "";
    "~^/pages($|/)"  "";
}

# Track A PHP 8 live-site image — single-site server, everything through the
# framework front controller (the framework serves its own static files via
# SiteFile::outputAsResponse, same as the gen-1 kernel and archive runtime).
#
# __SITE_HANDLE__ / __SITE_DB__ are rendered by entrypoint.sh from the
# SITE_HANDLE / SITE_DB container env (defaults: slate / $SITE_HANDLE).
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 200M;

    location / {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /opt/emergence/web/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # TLS terminates upstream (Cloud Run/LB) — without this the framework
        # sees plain HTTP and site-level force-HTTPS config (e.g. sla-cc's
        # local layer) 302-loops. Same call as the archive runtime's generated
        # config.
        fastcgi_param HTTPS on;
        # HTTPS alone isn't enough for every site's force-https check: some
        # site layers (educon's Site.config.php) also branch on REQUEST_SCHEME,
        # which the standard fastcgi_params include sets to nginx's literal
        # $scheme ("http" behind the TLS-terminating LB) — 302-looping every
        # request. Found during the educon leaf's build verification.
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param SITE_ROOT /opt/site;
        fastcgi_param SITE_HANDLE __SITE_HANDLE__;
        fastcgi_param SITE_DB __SITE_DB__;
        fastcgi_read_timeout 1800; # match the Cloud Run request timeout ceiling — admin connector syncs legitimately run >300s
    }

    # emit the per-path indexing directive computed above (only home + /pages
    # are indexable; empty $robots_tag => header omitted)
    add_header X-Robots-Tag $robots_tag always;
}
