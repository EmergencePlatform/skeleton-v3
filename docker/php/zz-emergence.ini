; Track A PHP 8 prototype runtime settings
; The legacy codebase was written against PHP 5's tolerance level: undefined
; index/offset reads were E_NOTICE there but are E_WARNING on PHP 8, and the
; framework's Whoops error handler converts anything inside the
; error_reporting mask into a thrown ErrorException. Masking warnings +
; notices restores the PHP 5-era behavior the code assumes; real fatals
; (E_ERROR, TypeError, etc.) still surface. Tightening this mask back up is
; on the production gap list (infra/live/README.md).
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_WARNING
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

memory_limit = 256M
upload_max_filesize = 200M
post_max_size = 200M
date.timezone = America/New_York
