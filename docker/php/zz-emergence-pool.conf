; Pass the container's environment through to PHP (getenv()) — site secrets
; (e.g. sla-cc's EMERGENCE_SAML2_PRIVATE_KEY, EMERGENCE_CANVAS_API_TOKEN,
; EMERGENCE_GSUITE_PRIVATE_KEY, EMERGENCE_PORTFOLIUM_PRIVATE_KEY) are injected
; as `docker run -e` vars sourced from Secret Manager, and media/GCS config
; (MEDIA_GCS_BUCKET, GOOGLE_APPLICATION_CREDENTIALS) rides the same channel.
; Stock php-fpm defaults clear_env=yes, which would strip them all before the
; worker sees them. The container env is curated (nothing lands in it that
; PHP shouldn't see), so passthrough is safe here.
[www]
clear_env = no

; --- capacity (sized 2026-08-21 for ~500 simultaneous users school-wide) ---
; Stock Debian defaults ran pm.max_children=5 — five concurrent PHP requests
; per container. Crawler traffic saturated the whole fleet (4 instances x 5
; workers) on go-live morning and queued real logins into 503s. ~20 workers
; per container at 2Gi (app peaks ~60-90MB/worker); Cloud Run concurrency
; should sit near this number so overflow scales out instead of queueing.
pm = dynamic
pm.max_children = 20
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500
